name: job-watcher
on:
  schedule:
    - cron: "*/20 * * * *"   # mỗi 20 phút (GitHub có thể trễ vài phút)
  workflow_dispatch:          # cho phép bấm chạy tay
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python job_watcher.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
      - name: Save seen jobs
        run: |
          git config user.name "job-watcher"
          git config user.email "job-watcher@users.noreply.github.com"
          git add seen.json open_jobs.md
          git diff --cached --quiet || (git commit -m "update seen jobs" && git pull --rebase origin main && git push)
