# ===== KEYWORD =====
keywords:
  # Tiêu đề job phải chứa ít nhất 1 cụm này (không phân biệt hoa/thường)
  include: ["MBA", "Summer Associate", "Summer 2027", "Internship", "Intern"]
  # Loại bỏ nếu tiêu đề chứa các cụm này.
  # KHÔNG thêm "Senior": Amazon đặt tên MBA intern kiểu "Senior Product Manager, MBA Internship"
  exclude: ["Co-op", "Coop", "Apprentice", "PhD", "Undergraduate", "Bachelor", "Software Engineer", "Software Development",
            "Hardware", "Research Scientist", "Data Scientist", "High School"]
  # Title words that mean "MBA-level". Jobs without these only alert if the description mentions an MBA.
  mba_signals: ["MBA", "Summer Associate", "Senior Associate", "Graduate", "Masters", "Master's", "Post-Graduate"]
  # MẢNG VIỆC: để [] = không giới hạn mảng (đang dùng).
  # Muốn thu hẹp sau này thì điền, VD: ["Product Manager", "Strategy", "Finance", "Marketing"]
  roles: []
  # Để trống [] nếu nhận mọi địa điểm
  # A job is KEPT if its location mentions any of these...
  locations: ["United States", "USA", "US"]
  # ...and otherwise DROPPED only if it names one of these non-US places.
  # Anything else (Chicago, Minneapolis, "2 Locations"...) is kept.
  exclude_locations: ["India", "Bangalore", "Bengaluru", "Hyderabad", "Pune", "Mumbai", "Gurgaon",
    "Canada", "Toronto", "Vancouver", "Montreal", "United Kingdom", "UK", "London", "Ireland", "Dublin",
    "Germany", "Berlin", "Munich", "France", "Paris", "Netherlands", "Amsterdam", "Spain", "Madrid",
    "Italy", "Switzerland", "Zurich", "Poland", "Warsaw", "Krakow", "Romania", "Czech", "Prague",
    "Hungary", "Budapest", "Sweden", "Denmark", "Belgium", "Portugal", "Lisbon", "Israel", "Tel Aviv",
    "China", "Shanghai", "Beijing", "Hong Kong", "Japan", "Tokyo", "Korea", "Seoul", "Taiwan",
    "Singapore", "Malaysia", "Philippines", "Manila", "Vietnam", "Australia", "Sydney", "Melbourne",
    "New Zealand", "Mexico", "Brazil", "Sao Paulo", "Argentina", "Colombia", "Costa Rica", "Chile",
    "South Africa", "UAE", "Dubai", "Saudi Arabia", "EMEA", "APAC", "LATAM",
    "Morocco", "Casablanca", "Egypt", "Nigeria", "Kenya", "Turkey", "Istanbul", "Pakistan", "Indonesia",
    "Jakarta", "Thailand", "Bangkok", "Peru", "Lima", "Austria", "Vienna", "Norway", "Oslo", "Finland",
    "Greece", "Bulgaria", "Serbia", "Croatia", "Slovakia", "Lithuania", "Estonia", "Ukraine",
    "Scotland", "Edinburgh", "Wales", "Luxembourg", "Qatar", "Puerto Rico", "Latium",
    # 3-letter country codes (Amazon uses these, e.g. "Fiano Romano, Latium, ITA")
    "IND", "GBR", "DEU", "CAN", "IRL", "FRA", "ITA", "ESP", "NLD", "POL", "ROU", "CZE", "LUX", "SWE",
    "CHN", "JPN", "KOR", "TWN", "SGP", "AUS", "PHL", "MYS", "VNM", "IDN", "THA", "BRA", "MEX", "ARG",
    "COL", "CRI", "CHL", "ZAF", "ARE", "SAU", "EGY", "ISR", "TUR"]

# ===== CHẤM ĐIỂM RESUME (cần ANTHROPIC_API_KEY) =====
model: claude-haiku-4-5-20251001
min_fit_score: 50      # dưới điểm này thì không báo
high_fit_score: 75     # từ điểm này trở lên: thông báo ưu tiên cao

# ===== CÔNG TY NHẬP TAY =====
# Công ty trong companies.txt được dò tự động (xem detected.yaml).
# Mục này dành cho công ty có trang riêng, hoặc để sửa kết quả dò sai.
#   greenhouse/lever/ashby: cần slug   | workday: dán link *.myworkdayjobs.com/<Site>
#   amazon: dùng API riêng của Amazon  | watch: link trang kết quả tìm kiếm (trang render sẵn HTML)
companies:
  - name: Amazon
    type: amazon
    search: ["MBA intern", "MBA internship", "Summer 2027"]
  - name: Google
    type: watch
    url: https://www.google.com/about/careers/applications/jobs/results?q=MBA%20intern
